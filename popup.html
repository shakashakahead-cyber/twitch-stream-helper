<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Twitch Stream Helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="loginTwitch">__MSG_loginButton__</button>
  <button id="logoutTwitch" style="display:none;">__MSG_logoutButton__</button>

  <div id="mainUI" style="display:none;">
    <div>
      <label>__MSG_streamTitleLabel__</label>
      <input type="text" id="streamTitle" maxlength="140">
      <span id="titleCount">0/140</span>
    </div>

    <div>
      <label>__MSG_categoryLabel__</label>
      <div class="category-row">
        <input type="text" id="game" placeholder="__MSG_categorySearchPlaceholder__">
        <img id="gameThumbnail" style="display:none;" />
      </div>
      <ul id="gameSuggestions" class="suggestions"></ul>
      <div id="selectedCategory"></div>
    </div>

    <div id="tagSection" style="display:none;">
      <label>__MSG_tagsLabel__</label>
      <div id="tagList"></div>
      <input type="text" id="newTag" placeholder="__MSG_newTagPlaceholder__">
      <button id="addTag">__MSG_addTagButton__</button>
      <ul id="tagSuggestions" class="tag-suggestions"></ul>
    </div>

    <div class="post-section">
      <label>__MSG_postToXSectionLabel__</label>
      <textarea id="customHashtags" placeholder="__MSG_customHashtagsPlaceholder__"></textarea>
      <label>
        <input type="checkbox" id="includeCategoryTag"> __MSG_includeCategoryCheckbox__
      </label>
      <button id="postToX">__MSG_postToXButton__</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
